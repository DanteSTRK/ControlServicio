<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Gestor de órdenes de servicio 100% offline con autocompletado por tienda y exportación JSON." />
  <title>Gestor de Órdenes de Servicio</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --info: #0ea5e9;
      --info-soft: #f0f9ff;
      --neutral: #64748b;
      --neutral-soft: #f1f5f9;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.12), 0 4px 6px -4px rgba(15, 23, 42, 0.06);
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --surface: #1e293b;
        --surface-hover: #334155;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --primary-soft: rgba(59, 130, 246, 0.15);
        --success-soft: rgba(16, 185, 129, 0.15);
        --warning-soft: rgba(245, 158, 11, 0.15);
        --danger-soft: rgba(239, 68, 68, 0.15);
        --info-soft: rgba(14, 165, 233, 0.15);
        --neutral-soft: rgba(100, 116, 139, 0.2);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
    }

    /* Header & Bulk Copy Actions */
    .app-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .offline-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .top-bulk-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-bulk {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-bulk:hover {
      background: var(--surface-hover);
      transform: translateY(-1px);
    }

    .btn-bulk:active {
      transform: translateY(0);
    }

    .btn-bulk.abiertos {
      border-left: 4px solid var(--danger);
    }

    .btn-bulk.pendientes {
      border-left: 4px solid var(--warning);
    }

    .badge-count {
      background: var(--neutral-soft);
      color: var(--text);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Main CTA Button */
    .btn-main-new {
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 16px;
      border: none;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-main-new:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }

    .btn-main-new:active {
      transform: translateY(0);
    }

    /* Search Box */
    .search-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 13px 40px 13px 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 1rem;
      display: none;
    }

    /* Filters & Sorting Bar */
    .controls-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .status-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .status-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.83rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .tab-btn .tab-num {
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.18);
      color: inherit;
    }

    .tab-btn.active .tab-num {
      background: rgba(255, 255, 255, 0.25);
    }

    .sort-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .sort-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sort-btn {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sort-btn.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Orders List & Cards */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 15px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }

    .order-card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .ticket-trigger {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid rgba(37, 99, 235, 0.25);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ticket-trigger:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .status-Abierto {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .status-Asignado {
      background: var(--info-soft);
      color: var(--info);
    }
    .status-Pendiente {
      background: var(--warning-soft);
      color: var(--warning);
    }
    .status-Cerrado {
      background: var(--success-soft);
      color: var(--success);
    }
    .status-Cancelado {
      background: var(--neutral-soft);
      color: var(--neutral);
    }

    .btn-copy-card {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-copy-card:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px 14px;
      margin-bottom: 10px;
    }

    .field-item {
      font-size: 0.86rem;
      display: flex;
      flex-direction: column;
    }

    .field-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .field-value {
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .interactive-chip {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      font-weight: 700;
      color: var(--primary);
      text-align: left;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .interactive-chip:hover {
      color: var(--primary-hover);
    }

    .card-details {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.86rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 1px solid var(--border);
    }

    .detail-row strong {
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .card-footer {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }

    /* Footer JSON Export/Import */
    .app-footer {
      margin-top: auto;
      padding: 20px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .footer-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-secondary {
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 540px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      animation: modalFadeIn 0.18s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 2;
    }

    .modal-header h2 {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.35rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .autofill-hint {
      font-size: 0.72rem;
      color: var(--success);
      font-weight: 600;
      display: none;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 68px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--surface);
      position: sticky;
      bottom: 0;
    }

    .modal-footer-right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .btn-primary {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 2000;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 560px) {
      .top-bulk-bar,
      .form-row,
      .footer-actions {
        grid-template-columns: 1fr;
      }
      .sort-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header & Bulk Copy Actions -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-title">
          <div class="brand-logo" aria-hidden="true">OS</div>
          <h1>Órdenes de Servicio</h1>
        </div>
        <span class="offline-pill" title="Datos guardados localmente en este dispositivo">
          ● 100% Offline
        </span>
      </div>

      <!-- Botones superiores para copiar reportes Abiertos y Pendientes -->
      <div class="top-bulk-bar">
        <button type="button" class="btn-bulk abiertos" id="btnCopyAllAbiertos">
          <span>📋 Copiar Abiertos</span>
          <span class="badge-count" id="countBulkAbiertos">0</span>
        </button>
        <button type="button" class="btn-bulk pendientes" id="btnCopyAllPendientes">
          <span>📋 Copiar Pendientes</span>
          <span class="badge-count" id="countBulkPendientes">0</span>
        </button>
      </div>
    </header>

    <!-- Botón Grande de Acceso Directo a Nueva Orden -->
    <button type="button" class="btn-main-new" id="btnNewOrder">
      <span>＋ Nueva Orden de Servicio</span>
    </button>

    <!-- Buscador Rápido -->
    <div class="search-wrapper">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Buscar por Ticket, Tienda, Coordinador, Equipo, Falla, Observaciones..."
        autocomplete="off"
      />
      <button type="button" class="search-clear" id="btnClearSearch" title="Limpiar búsqueda">✕</button>
    </div>

    <!-- Filtros por Estatus y Ordenamiento -->
    <section class="controls-section">
      <div class="status-tabs" id="statusTabs" role="tablist">
        <button type="button" class="tab-btn active" data-status="Todos">
          Todos (Activos) <span class="tab-num" id="tabCountTodos">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="Abierto">
          Abiertos <span class="tab-num" id="tabCountAbierto">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="Asignado">
          Asignados <span class="tab-num" id="tabCountAsignado">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="Pendiente">
          Pendientes <span class="tab-num" id="tabCountPendiente">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="Cerrado">
          Cerrados <span class="tab-num" id="tabCountCerrado">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="Cancelado">
          Cancelados <span class="tab-num" id="tabCountCancelado">0</span>
        </button>
      </div>

      <div class="sort-bar">
        <span class="sort-label">Ordenar por:</span>
        <div class="sort-buttons" id="sortButtons">
          <button type="button" class="sort-btn active" data-sort="time-desc">Fecha/Hora ↓ (Recientes)</button>
          <button type="button" class="sort-btn" data-sort="time-asc">Fecha/Hora ↑ (Antiguos)</button>
          <button type="button" class="sort-btn" data-sort="alpha-asc">Alfabético A→Z</button>
          <button type="button" class="sort-btn" data-sort="alpha-desc">Alfabético Z→A</button>
        </div>
      </div>
    </section>

    <!-- Lista de Órdenes de Servicio -->
    <main id="ordersList" class="orders-list" aria-live="polite"></main>
  </div>

  <!-- Pie de Página: Exportar / Importar JSON Local -->
  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-title">
        <span>Respaldo Local Seguro (JSON)</span>
        <span id="totalStorageCount">0 registros guardados</span>
      </div>
      <div class="footer-actions">
        <button type="button" class="btn-secondary" id="btnExportJson">
          ⬇️ Exportar datos a JSON

          ⬆️ Importar archivo JSON
        </button>
        <input type="file" id="fileInputJson" accept=".json,application/json" style="display: none;" />
      </div>
    </div>
  </footer>

  <!-- Modal Crear / Editar Orden de Servicio -->
  <div class="modal-backdrop" id="orderModal" role="dialog" aria-modal="true" aria-labelledby="orderModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="orderModalTitle">Nueva Orden de Servicio</h2>
        <button type="button" class="btn-close" id="btnCloseOrderModal" aria-label="Cerrar">✕</button>
      </div>
      <form id="orderForm">
        <div class="modal-body">
          <input type="hidden" id="orderIdInput" />

          <div class="form-row">
            <div class="form-group">
              <label for="ticketInput">
                <span>Ticket *</span>
                <span class="autofill-hint" id="autofillBadge">✓ Tienda detectada</span>
              </label>
              <input
                type="text"
                id="ticketInput"
                class="form-control"
                placeholder="Ej. 10425-8891"
                required
                autocomplete="off"
              />
            </div>

            <div class="form-group">
              <label for="estatusInput">Estatus *</label>
              <select id="estatusInput" class="form-control" required>
                <option value="Abierto">Abierto</option>
                <option value="Asignado">Asignado</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Cerrado">Cerrado</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="tiendaInput">Tienda *</label>
              <input
                type="text"
                id="tiendaInput"
                class="form-control"
                placeholder="Nombre o sucursal"
                required
                autocomplete="off"
              />
            </div>

            <div class="form-group">
              <label for="coordinadorInput">Coordinador *</label>
              <input
                type="text"
                id="coordinadorInput"
                class="form-control"
                placeholder="Nombre del coordinador"
                required
                autocomplete="off"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="equipoInput">Equipo *</label>
            <select id="equipoInput" class="form-control" required>
              <option value="Merrychef">Merrychef</option>
              <option value="Turbochef">Turbochef</option>
              <option value="Bunn">Bunn</option>
              <option value="NuVu">NuVu</option>
              <option value="Molino">Molino</option>
              <option value="Licuadora">Licuadora</option>
              <option value="Báscula">Báscula</option>
              <option value="Otros">Otros</option>
            </select>
          </div>

          <div class="form-group">
            <label for="fallaInput">Falla reportada *</label>
            <textarea
              id="fallaInput"
              class="form-control"
              placeholder="Descripción breve de la falla..."
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="observacionesInput">Observaciones</label>
            <textarea
              id="observacionesInput"
              class="form-control"
              placeholder="Notas adicionales, refacciones, seguimiento..."
            ></textarea>
          </div>

          <div id="timestampPreview" style="font-size: 0.78rem; color: var(--text-muted);"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-danger" id="btnDeleteOrder" style="display: none;">
            🗑 Eliminar
          </button>
          <div class="modal-footer-right">
            <button type="button" class="btn-secondary" id="btnCancelOrderModal">Cancelar</button>
            <button type="submit" class="btn-primary" id="btnSaveOrder">Guardar Orden</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Vista Filtrada por Tienda o Coordinador -->
  <div class="modal-backdrop" id="groupModal" role="dialog" aria-modal="true" aria-labelledby="groupModalTitle">
    <div class="modal-content" style="max-width: 680px;">
      <div class="modal-header">
        <h2 id="groupModalTitle">Historial</h2>
        <button type="button" class="btn-close" id="btnCloseGroupModal" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal-body">
        <div class="sort-bar" style="margin-bottom: 4px;">
          <span class="sort-label" id="groupSubtitle">Tickets relacionados</span>
          <div class="sort-buttons" id="groupSortButtons">
            <button type="button" class="sort-btn active" data-gsort="time-desc">Fecha ↓</button>
            <button type="button" class="sort-btn" data-gsort="time-asc">Fecha ↑</button>
            <button type="button" class="sort-btn" data-gsort="alpha-asc">A→Z</button>
            <button type="button" class="sort-btn" data-gsort="alpha-desc">Z→A</button>
          </div>
        </div>
        <div id="groupOrdersList" class="orders-list" style="margin-bottom: 0;"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'gestor_ordenes_servicio_v1';

      // Estado de la aplicación
      let orders = [];
      let currentStatusFilter = 'Todos';
      let currentSort = 'time-desc';
      let searchQuery = '';

      // Estado del modal de agrupación (Tienda / Coordinador)
      let activeGroupType = null; // 'tienda' | 'coordinador'
      let activeGroupValue = '';
      let activeGroupSort = 'time-desc';

      // Referencias DOM
      const ordersListEl = document.getElementById('ordersList');
      const searchInput = document.getElementById('searchInput');
      const btnClearSearch = document.getElementById('btnClearSearch');
      const statusTabs = document.getElementById('statusTabs');
      const sortButtons = document.getElementById('sortButtons');
      const totalStorageCount = document.getElementById('totalStorageCount');

      // Botones superiores de copiado masivo
      const btnCopyAllAbiertos = document.getElementById('btnCopyAllAbiertos');
      const btnCopyAllPendientes = document.getElementById('btnCopyAllPendientes');
      const countBulkAbiertos = document.getElementById('countBulkAbiertos');
      const countBulkPendientes = document.getElementById('countBulkPendientes');

      // Modal Formulario
      const orderModal = document.getElementById('orderModal');
      const orderForm = document.getElementById('orderForm');
      const orderModalTitle = document.getElementById('orderModalTitle');
      const orderIdInput = document.getElementById('orderIdInput');
      const ticketInput = document.getElementById('ticketInput');
      const tiendaInput = document.getElementById('tiendaInput');
      const estatusInput = document.getElementById('estatusInput');
      const equipoInput = document.getElementById('equipoInput');
      const coordinadorInput = document.getElementById('coordinadorInput');
      const fallaInput = document.getElementById('fallaInput');
      const observacionesInput = document.getElementById('observacionesInput');
      const autofillBadge = document.getElementById('autofillBadge');
      const timestampPreview = document.getElementById('timestampPreview');
      const btnDeleteOrder = document.getElementById('btnDeleteOrder');

      // Modal Grupo (Tienda / Coordinador)
      const groupModal = document.getElementById('groupModal');
      const groupModalTitle = document.getElementById('groupModalTitle');
      const groupSubtitle = document.getElementById('groupSubtitle');
      const groupOrdersList = document.getElementById('groupOrdersList');
      const groupSortButtons = document.getElementById('groupSortButtons');

      // Exportar / Importar
      const btnExportJson = document.getElementById('btnExportJson');
      const btnImportJson = document.getElementById('btnImportJson');
      const fileInputJson = document.getElementById('fileInputJson');

      // Inicialización
      function init() {
        loadOrders();
        renderAll();
        bindEvents();
        registerSW();
      }

      function loadOrders() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          orders = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(orders)) orders = [];
        } catch (err) {
          console.error('Error leyendo localStorage:', err);
          orders = [];
        }
      }

      function saveOrders() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
          renderAll();
          if (groupModal.classList.contains('open')) {
            renderGroupModalList();
          }
        } catch (err) {
          showToast('⚠️ Error al guardar en almacenamiento local');
        }
      }

      // Formatear fecha legible
      function formatDate(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return d.toLocaleString('es-MX', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }

      // Escapar HTML para prevenir XSS
      function escapeHTML(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Autocompletar Tienda y Coordinador basado en los primeros 5 dígitos exactos del Ticket
      function handleTicketPrefixAutofill() {
        const val = ticketInput.value.trim();
        if (val.length >= 5) {
          const prefix = val.slice(0, 5);
          // Buscar la entrada más reciente (por timestamp descendente) cuyos primeros 5 caracteres coincidan exactamente
          const sortedByLatest = [...orders].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          const match = sortedByLatest.find(
            (o) => o.ticket && String(o.ticket).trim().slice(0, 5) === prefix && o.id !== orderIdInput.value
          );
          if (match) {
            tiendaInput.value = match.tienda || '';
            coordinadorInput.value = match.coordinador || '';
            autofillBadge.style.display = 'inline';
            return;
          }
        }
        autofillBadge.style.display = 'none';
      }

      // Ordenar lista según criterio seleccionado
      function sortOrdersList(list, sortCriteria) {
        const copy = [...list];
        switch (sortCriteria) {
          case 'time-asc':
            return copy.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          case 'alpha-asc':
            return copy.sort((a, b) =>
              String(a.tienda || a.ticket || '').localeCompare(String(b.tienda || b.ticket || ''), 'es', { sensitivity: 'base' })
            );
          case 'alpha-desc':
            return copy.sort((a, b) =>
              String(b.tienda || b.ticket || '').localeCompare(String(a.tienda || a.ticket || ''), 'es', { sensitivity: 'base' })
            );
          case 'time-desc':
          default:
            return copy.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }
      }

      // Filtrar órdenes para la vista principal
      function getFilteredOrders() {
        return orders.filter((o) => {
          // Filtro por estatus
          if (currentStatusFilter === 'Todos') {
            if (o.estatus === 'Cerrado' || o.estatus === 'Cancelado') return false;
          } else if (o.estatus !== currentStatusFilter) {
            return false;
          }

          // Filtro por buscador
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const haystack = [
              o.ticket,
              o.tienda,
              o.estatus,
              o.equipo,
              o.coordinador,
              o.falla,
              o.observaciones,
              formatDate(o.timestamp)
            ]
              .join(' ')
              .toLowerCase();
            if (!haystack.includes(q)) return false;
          }

          return true;
        });
      }

      // Actualizar contadores de pestañas y botones superiores
      function updateCounters() {
        const counts = {
          Todos: 0,
          Abierto: 0,
          Asignado: 0,
          Pendiente: 0,
          Cerrado: 0,
          Cancelado: 0
        };

        orders.forEach((o) => {
          if (counts[o.estatus] !== undefined) {
            counts[o.estatus]++;
          }
          if (o.estatus !== 'Cerrado' && o.estatus !== 'Cancelado') {
            counts.Todos++;
          }
        });

        document.getElementById('tabCountTodos').textContent = counts.Todos;
        document.getElementById('tabCountAbierto').textContent = counts.Abierto;
        document.getElementById('tabCountAsignado').textContent = counts.Asignado;
        document.getElementById('tabCountPendiente').textContent = counts.Pendiente;
        document.getElementById('tabCountCerrado').textContent = counts.Cerrado;
        document.getElementById('tabCountCancelado').textContent = counts.Cancelado;

        countBulkAbiertos.textContent = counts.Abierto;
        countBulkPendientes.textContent = counts.Pendiente;
        totalStorageCount.textContent = `${orders.length} ${orders.length === 1 ? 'registro guardado' : 'registros guardados'}`;
      }

      // Generar tarjeta HTML de una orden
      function createOrderCardHTML(order) {
        const safeTicket = escapeHTML(order.ticket);
        const safeTienda = escapeHTML(order.tienda);
        const safeEquipo = escapeHTML(order.equipo);
        const safeCoord = escapeHTML(order.coordinador);
        const safeFalla = escapeHTML(order.falla);
        const safeObs = escapeHTML(order.observaciones || 'Sin observaciones');
        const safeStatus = escapeHTML(order.estatus);
        const prefix = escapeHTML(String(order.ticket || '').slice(0, 5));

        return `
          <article class="order-card" data-id="${escapeHTML(order.id)}">
            <div class="card-top">
              <button
                type="button"
                class="ticket-trigger"
                data-action="edit-ticket"
                data-id="${escapeHTML(order.id)}"
                title="Pulsar para editar o eliminar este ticket"
              >
                <span>#${safeTicket}</span>
                <span style="font-size:0.75rem; opacity:0.8;">✎</span>
              </button>

              <div class="card-top-right">
                <span class="status-badge status-${safeStatus}">${safeStatus}</span>
                <button
                  type="button"
                  class="btn-copy-card"
                  data-action="copy-single"
                  data-id="${escapeHTML(order.id)}"
                  title="Copiar datos de esta orden"
                >
                  📋 Copiar
                </button>
              </div>
            </div>

            <div class="card-grid">
              <div class="field-item">
                <span class="field-label">Tienda (ID: ${prefix || 'N/A'})</span>
                <button
                  type="button"
                  class="interactive-chip"
                  data-action="filter-tienda"
                  data-value="${safeTienda}"
                  title="Ver todos los tickets de esta Tienda"
                >
                  🏬 ${safeTienda}
                </button>
              </div>

              <div class="field-item">
                <span class="field-label">Coordinador</span>
                <button
                  type="button"
                  class="interactive-chip"
                  data-action="filter-coordinador"
                  data-value="${safeCoord}"
                  title="Ver todos los tickets de este Coordinador"
                >
                  👤 ${safeCoord}
                </button>
              </div>

              <div class="field-item">
                <span class="field-label">Equipo</span>
                <span class="field-value">⚙️ ${safeEquipo}</span>
              </div>
            </div>

            <div class="card-details">
              <div class="detail-row"><strong>Falla:</strong> ${safeFalla}</div>
              <div class="detail-row"><strong>Observaciones:</strong> ${safeObs}</div>
            </div>

            <div class="card-footer">
              <span>🕒 ${formatDate(order.timestamp)}</span>
              <span>Pulsar #Ticket para editar</span>
            </div>
          </article>
        `;
      }

      // Renderizar vista principal
      function renderAll() {
        updateCounters();
        const filtered = sortOrdersList(getFilteredOrders(), currentSort);

        if (filtered.length === 0) {
          ordersListEl.innerHTML = `
            <div class="empty-state">
              <p style="font-weight: 600; margin-bottom: 4px;">No hay órdenes de servicio para mostrar</p>
              <p style="font-size: 0.85rem;">Usa el botón superior "Nueva Orden de Servicio" o ajusta los filtros de búsqueda.</p>
            </div>
          `;
          return;
        }

        ordersListEl.innerHTML = filtered.map(createOrderCardHTML).join('');
      }

      // Copiar al portapapeles con fallback seguro
      async function copyTextToClipboard(text, successMessage) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const tempArea = document.createElement('textarea');
            tempArea.value = text;
            tempArea.style.position = 'fixed';
            tempArea.style.left = '-9999px';
            document.body.appendChild(tempArea);
            tempArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempArea);
          }
          showToast(successMessage || '✅ Copiado al portapapeles');
        } catch (err) {
          showToast('⚠️ No se pudo copiar automáticamente');
        }
      }

      // Copiar orden individual (Ticket, Tienda, Equipo, Coordinador, Falla, Estatus, Observaciones)
      function copySingleOrder(id) {
        const order = orders.find((o) => o.id === id);
        if (!order) return;
        const text = [
          `Ticket: ${order.ticket}`,
          `Tienda: ${order.tienda}`,
          `Equipo: ${order.equipo}`,
          `Coordinador: ${order.coordinador}`,
          `Falla: ${order.falla}`,
          `Estatus: ${order.estatus}`,
          `Observaciones: ${order.observaciones || 'N/A'}`
        ].join('\n');

        copyTextToClipboard(text, `📋 Ticket #${order.ticket} copiado`);
      }

      // Copiar masivamente por estatus (Ticket, Tienda, Equipo, Coordinador, Falla)
      function copyBulkByStatus(targetStatus) {
        const matching = sortOrdersList(
          orders.filter((o) => o.estatus === targetStatus),
          currentSort
        );

        if (matching.length === 0) {
          showToast(`ℹ️ No hay reportes con estatus "${targetStatus}"`);
          return;
        }

        const blocks = matching.map((o, idx) => {
          return [
            `[${idx + 1}] Ticket: ${o.ticket}`,
            `Tienda: ${o.tienda}`,
            `Equipo: ${o.equipo}`,
            `Coordinador: ${o.coordinador}`,
            `Falla: ${o.falla}`
          ].join('\n');
        });

        const finalString = `=== REPORTES ${targetStatus.toUpperCase()}S (${matching.length}) ===\n\n` + blocks.join('\n\n-------------------\n\n');
        copyTextToClipboard(finalString, `📋 ${matching.length} reporte(s) "${targetStatus}" copiados`);
      }

      // Abrir modal para crear o editar
      function openOrderModal(editId = null) {
        orderForm.reset();
        autofillBadge.style.display = 'none';

        if (editId) {
          const existing = orders.find((o) => o.id === editId);
          if (!existing) return;
          orderModalTitle.textContent = `Editar Ticket #${existing.ticket}`;
          orderIdInput.value = existing.id;
          ticketInput.value = existing.ticket;
          tiendaInput.value = existing.tienda;
          estatusInput.value = existing.estatus;
          equipoInput.value = existing.equipo;
          coordinadorInput.value = existing.coordinador;
          fallaInput.value = existing.falla;
          observacionesInput.value = existing.observaciones || '';
          timestampPreview.textContent = `Marca de tiempo original: ${formatDate(existing.timestamp)}`;
          btnDeleteOrder.style.display = 'inline-flex';
        } else {
          orderModalTitle.textContent = 'Nueva Orden de Servicio';
          orderIdInput.value = '';
          estatusInput.value = 'Abierto';
          equipoInput.value = 'Merrychef';
          timestampPreview.textContent = `Marca de tiempo automática al guardar: ${formatDate(Date.now())}`;
          btnDeleteOrder.style.display = 'none';
        }

        orderModal.classList.add('open');
        setTimeout(() => ticketInput.focus(), 60);
      }

      function closeOrderModal() {
        orderModal.classList.remove('open');
      }

      // Abrir modal de historial por Tienda o Coordinador
      function openGroupModal(type, value) {
        activeGroupType = type;
        activeGroupValue = value;
        groupModalTitle.textContent =
          type === 'tienda' ? `🏬 Tienda: ${value}` : `👤 Coordinador: ${value}`;
        renderGroupModalList();
        groupModal.classList.add('open');
      }

      function renderGroupModalList() {
        if (!activeGroupType) return;
        const matching = orders.filter((o) => {
          const fieldVal = activeGroupType === 'tienda' ? o.tienda : o.coordinador;
          return String(fieldVal || '').trim().toLowerCase() === String(activeGroupValue || '').trim().toLowerCase();
        });

        const sorted = sortOrdersList(matching, activeGroupSort);
        groupSubtitle.textContent = `${sorted.length} ticket(s) encontrado(s)`;

        if (sorted.length === 0) {
          groupOrdersList.innerHTML = `<div class="empty-state">No quedaron tickets en este grupo.</div>`;
          return;
        }

        groupOrdersList.innerHTML = sorted.map(createOrderCardHTML).join('');
      }

      function closeGroupModal() {
        groupModal.classList.remove('open');
        activeGroupType = null;
      }

      // Mostrar notificación flotante
      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }

      // Eventos
      function bindEvents() {
        // Abrir nueva orden
        document.getElementById('btnNewOrder').addEventListener('click', () => openOrderModal(null));
        document.getElementById('btnCloseOrderModal').addEventListener('click', closeOrderModal);
        document.getElementById('btnCancelOrderModal').addEventListener('click', closeOrderModal);

        // Autocompletado de primeros 5 dígitos del Ticket
        ticketInput.addEventListener('input', handleTicketPrefixAutofill);

        // Guardar orden (Nueva o Editada)
        orderForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const id = orderIdInput.value;
          const payload = {
            ticket: ticketInput.value.trim(),
            tienda: tiendaInput.value.trim(),
            estatus: estatusInput.value,
            equipo: equipoInput.value,
            coordinador: coordinadorInput.value.trim(),
            falla: fallaInput.value.trim(),
            observaciones: observacionesInput.value.trim()
          };

          if (id) {
            const idx = orders.findIndex((o) => o.id === id);
            if (idx !== -1) {
              orders[idx] = {
                ...orders[idx],
                ...payload,
                updatedAt: Date.now()
              };
              showToast('✅ Orden actualizada');
            }
          } else {
            const newOrder = {
              id: 'os_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
              ...payload,
              timestamp: Date.now()
            };
            orders.unshift(newOrder);
            showToast('✅ Nueva orden registrada');
          }

          saveOrders();
          closeOrderModal();
        });

        // Eliminar orden
        btnDeleteOrder.addEventListener('click', () => {
          const id = orderIdInput.value;
          if (!id) return;
          const target = orders.find((o) => o.id === id);
          if (!target) return;
          if (confirm(`¿Eliminar definitivamente el Ticket #${target.ticket}?`)) {
            orders = orders.filter((o) => o.id !== id);
            saveOrders();
            closeOrderModal();
            showToast('🗑 Orden eliminada');
          }
        });

        // Delegación de clics en tarjetas (lista principal y modal de grupo)
        function handleCardContainerClick(e) {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const action = btn.getAttribute('data-action');

          if (action === 'edit-ticket') {
            openOrderModal(btn.getAttribute('data-id'));
          } else if (action === 'copy-single') {
            copySingleOrder(btn.getAttribute('data-id'));
          } else if (action === 'filter-tienda') {
            openGroupModal('tienda', btn.getAttribute('data-value'));
          } else if (action === 'filter-coordinador') {
            openGroupModal('coordinador', btn.getAttribute('data-value'));
          }
        }

        ordersListEl.addEventListener('click', handleCardContainerClick);
        groupOrdersList.addEventListener('click', handleCardContainerClick);

        // Cerrar modal de grupo
        document.getElementById('btnCloseGroupModal').addEventListener('click', closeGroupModal);

        // Cerrar modales al hacer clic en el fondo oscuro
        orderModal.addEventListener('click', (e) => {
          if (e.target === orderModal) closeOrderModal();
        });
        groupModal.addEventListener('click', (e) => {
          if (e.target === groupModal) closeGroupModal();
        });

        // Buscador en tiempo real
        searchInput.addEventListener('input', () => {
          searchQuery = searchInput.value.trim();
          btnClearSearch.style.display = searchQuery ? 'block' : 'none';
          renderAll();
        });

        btnClearSearch.addEventListener('click', () => {
          searchInput.value = '';
          searchQuery = '';
          btnClearSearch.style.display = 'none';
          renderAll();
          searchInput.focus();
        });

        // Pestañas de Estatus
        statusTabs.addEventListener('click', (e) => {
          const tab = e.target.closest('.tab-btn');
          if (!tab) return;
          statusTabs.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
          tab.classList.add('active');
          currentStatusFilter = tab.getAttribute('data-status');
          renderAll();
        });

        // Botones de ordenamiento principal
        sortButtons.addEventListener('click', (e) => {
          const btn = e.target.closest('.sort-btn');
          if (!btn) return;
          sortButtons.querySelectorAll('.sort-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          currentSort = btn.getAttribute('data-sort');
          renderAll();
        });

        // Botones de ordenamiento dentro del modal de Tienda/Coordinador
        groupSortButtons.addEventListener('click', (e) => {
          const btn = e.target.closest('.sort-btn');
          if (!btn) return;
          groupSortButtons.querySelectorAll('.sort-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          activeGroupSort = btn.getAttribute('data-gsort');
          renderGroupModalList();
        });

        // Copiado masivo superior (Abiertos y Pendientes)
        btnCopyAllAbiertos.addEventListener('click', () => copyBulkByStatus('Abierto'));
        btnCopyAllPendientes.addEventListener('click', () => copyBulkByStatus('Pendiente'));

        // Exportar a archivo JSON local
        btnExportJson.addEventListener('click', () => {
          const dataStr = JSON.stringify(orders, null, 2);
          const blob = new Blob([dataStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateTag = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `respaldo_ordenes_servicio_${dateTag}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('⬇️ Archivo JSON exportado correctamente');
        });

        // Importar desde archivo JSON local
        btnImportJson.addEventListener('click', () => fileInputJson.click());

        fileInputJson.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (!Array.isArray(imported)) {
                throw new Error('Formato inválido');
              }
              // Fusión segura por ID o creación de ID si no existe
              const existingMap = new Map(orders.map((o) => [o.id, o]));
              imported.forEach((item) => {
                if (item && item.ticket) {
                  const safeId = item.id || 'os_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
                  existingMap.set(safeId, {
                    id: safeId,
                    ticket: String(item.ticket),
                    tienda: String(item.tienda || ''),
                    estatus: item.estatus || 'Abierto',
                    equipo: item.equipo || 'Otros',
                    coordinador: String(item.coordinador || ''),
                    falla: String(item.falla || ''),
                    observaciones: String(item.observaciones || ''),
                    timestamp: Number(item.timestamp) || Date.now()
                  });
                }
              });
              orders = Array.from(existingMap.values());
              saveOrders();
              showToast(`⬆️ ${imported.length} registro(s) importados con éxito`);
            } catch (err) {
              showToast('⚠️ El archivo seleccionado no es un JSON válido');
            } finally {
              fileInputJson.value = '';
            }
          };
          reader.readAsText(file);
        });
      }

      // Registro del Service Worker para funcionamiento PWA 100% Offline
      function registerSW() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {
              // Silencioso en entorno file:// local, activo en GitHub Pages HTTPS
            });
          });
        }
      }

      init();
    })();
  </script>
</body>
</html>
