<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órdenes de Servicio</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#2563eb;--acx:#fff;--in:#f1f5f9;
--Abierto:#2563eb;--Asignado:#7c3aed;--Pendiente:#d97706;--Cerrado:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#162033;--tx:#e8edf5;--mu:#94a3b8;--ln:#26334a;--ac:#38bdf8;--acx:#06283d;--in:#0f1a2c;
--Abierto:#60a5fa;--Asignado:#a78bfa;--Pendiente:#fbbf24;--Cerrado:#4ade80}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);
padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;display:grid;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;gap:8px}
.top button,.chip,.sm{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px}
.top button{flex:1}
.big{width:100%;background:var(--ac);color:var(--acx);border-radius:18px;padding:22px;font-size:20px;font-weight:700;box-shadow:0 8px 24px -10px var(--ac)}
.big:active{transform:scale(.99)}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;color:var(--mu)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk{font-weight:700;font-size:17px;color:var(--ac);text-decoration:underline;text-underline-offset:3px}
.badge{font-size:12px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:2px 10px}
.f{display:flex;align-items:baseline;gap:8px}
.f i{font-style:normal;color:var(--mu);font-size:12px;min-width:84px}
.f span{flex:1;overflow-wrap:anywhere}
.f span[data-a]{color:var(--ac);cursor:pointer}
.cp{color:var(--mu);font-size:15px;padding:2px 6px;border-radius:8px}
.cp:hover{background:var(--in)}
.date{color:var(--mu);font-size:12px}
.empty{text-align:center;color:var(--mu);padding:32px 0}
h2{font-size:18px}
dialog{border:0;border-radius:20px;padding:20px;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(2,6,23,.6)}
form,.grp{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--mu);font-weight:600}
.row{display:flex;gap:8px}.row>*{flex:1}
.pri{background:var(--ac);color:var(--acx);border-radius:12px;padding:12px;font-weight:700}
.dan{color:#dc2626;border:1px solid #dc2626;border-radius:12px;padding:12px;font-weight:600}
.sec{border:1px solid var(--ln);border-radius:12px;padding:12px;font-weight:600}
.item{background:var(--in);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
footer{display:grid;gap:8px;border-top:1px solid var(--ln);padding-top:16px;margin-top:6px}
footer p{color:var(--mu);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;z-index:99;pointer-events:none}
#toast.show{transform:translateX(-50%)}
</style>
</head>
<body>
<main>
  <div class="top">
    <button id="cpAb">📋 Copiar abiertos</button>
    <button id="cpPe">📋 Copiar pendientes</button>
  </div>
  <button class="big" id="nuevo">＋ Nueva orden de servicio</button>
  <input type="search" id="q" placeholder="Buscar ticket, tienda, equipo, coordinador, falla…" aria-label="Buscar">
  <div class="chips" id="chips"></div>
  <div id="lista" class="grp"></div>
  <footer>
    <div class="row">
      <button class="sec" id="exp">⬇ Exportar datos (JSON)</button>
      <button class="sec" id="imp">⬆ Importar datos (JSON)</button>
    </div>
    <input type="file" id="file" accept="application/json,.json" hidden>
    <p>Los datos se guardan solo en este dispositivo (localStorage). Exporta un respaldo con frecuencia. Al importar, las órdenes se combinan con las existentes.</p>
  </footer>
</main>

<dialog id="dlg">
  <form id="frm">
    <h2 id="dt">Nueva orden</h2>
    <label>Ticket<input id="ticket" required autocomplete="off" inputmode="numeric"></label>
    <div class="row">
      <label>Tienda<input id="tienda" required autocomplete="off"></label>
      <label>Status<select id="status"></select></label>
    </div>
    <label>Equipo<input id="equipo" list="eqs" autocomplete="off" placeholder="Elige o escribe"></label>
    <datalist id="eqs"></datalist>
    <label>Coordinador<input id="coord" autocomplete="off"></label>
    <label>Falla<input id="falla" autocomplete="off"></label>
    <label>Observaciones<textarea id="obs" rows="3"></textarea></label>
    <p class="date" id="meta"></p>
    <button class="pri" type="submit">Guardar</button>
    <div class="row">
      <button class="sec" type="button" id="cancel">Cancelar</button>
      <button class="dan" type="button" id="del" hidden>Eliminar</button>
    </div>
  </form>
</dialog>

<dialog id="gdlg">
  <div class="grp">
    <h2 id="gt"></h2>
    <select id="gs" aria-label="Ordenar">
      <option value="fd">Fecha y hora ↓ (más recientes)</option>
      <option value="fa">Fecha y hora ↑ (más antiguas)</option>
      <option value="az">Alfabético A → Z</option>
      <option value="za">Alfabético Z → A</option>
    </select>
    <div id="gl" class="grp"></div>
    <button class="sec" id="gc">Cerrar</button>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
const K='ordenes_servicio_v1';
const STATUS=['Abierto','Asignado','Pendiente','Cerrado'];
const EQUIPOS=['Merrychef','Bunn','Nuvu','Molino','Licuadora','Turbochef','Báscula','Otros'];
const FILTROS=[['todos','Todos'],['Abierto','Abiertos'],['Asignado','Asignados'],['Cerrado','Cerrados'],['Pendiente','Pendientes']];
const $=s=>document.querySelector(s);
let D=load(),filtro='todos',editId=null,grp=null;

function load(){try{const v=JSON.parse(localStorage.getItem(K));return Array.isArray(v)?v:[]}catch{return[]}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch{toast('No se pudo guardar')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}
async function copy(txt){
  try{await navigator.clipboard.writeText(txt)}catch{
    const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();
    try{document.execCommand('copy')}catch{}a.remove()}
  toast('Copiado ✓')}

/* ---------- Init UI ---------- */
$('#status').innerHTML=STATUS.map(s=>`<option>${s}</option>`).join('');
$('#eqs').innerHTML=EQUIPOS.map(s=>`<option value="${s}">`).join('');
$('#chips').innerHTML=FILTROS.map(([v,l])=>`<button class="chip" data-f="${v}">${l}</button>`).join('');

/* ---------- Lista ---------- */
function render(){
  const q=$('#q').value.trim().toLowerCase();
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===filtro));
  const rows=D.filter(d=>(filtro==='todos'?d.status!=='Cerrado':d.status===filtro)&&
    (!q||[d.ticket,d.tienda,d.status,d.equipo,d.coord,d.falla,d.obs].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>b.creado-a.creado);
  $('#lista').innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">No hay órdenes aquí. Toca “Nueva orden de servicio” para crear la primera.</p>';
}
function field(label,key,val,link){
  if(!val&&key!=='ticket')return '';
  return `<div class="f"><i>${label}</i><span ${link||''}>${esc(val)}</span><button class="cp" data-c="${key}" title="Copiar ${label}">⧉</button></div>`}
function card(d){
  return `<article class="card" style="--c:var(--${d.status})" data-id="${d.id}">
  <div class="head"><span class="tk" data-a="edit" role="button" tabindex="0">${esc(d.ticket)}</span><span class="badge">${d.status}</span></div>
  ${field('Tienda','tienda',d.tienda,'data-a="tienda"')}
  ${field('Equipo','equipo',d.equipo)}
  ${field('Coordinador','coord',d.coord,'data-a="coord"')}
  ${field('Falla','falla',d.falla)}
  ${field('Status','status',d.status)}
  ${field('Observaciones','obs',d.obs)}
  <div class="date">Creado ${fmt(d.creado)}${d.editado?' · editado '+fmt(d.editado):''}</div></article>`}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){filtro=f.dataset.f;render();return}
  const art=e.target.closest('[data-id]');
  if(!art)return;
  const d=D.find(x=>x.id===art.dataset.id);if(!d)return;
  const c=e.target.closest('[data-c]');if(c){copy(d[c.dataset.c]||'');return}
  const a=e.target.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='edit')abrir(d);
  else abrirGrupo(a.dataset.a,d[a.dataset.a]);
});
$('#lista').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.a==='edit')e.target.click()});
$('#q').addEventListener('input',render);

/* ---------- Formulario ---------- */
const ids=['ticket','tienda','status','equipo','coord','falla','obs'];
function abrir(d){
  editId=d?d.id:null;
  $('#dt').textContent=d?'Editar orden':'Nueva orden';
  $('#ticket').value=d?.ticket||'';$('#tienda').value=d?.tienda||'';$('#status').value=d?.status||'Abierto';
  $('#equipo').value=d?.equipo||'';$('#coord').value=d?.coord||'';$('#falla').value=d?.falla||'';$('#obs').value=d?.obs||'';
  ['tienda','coord'].forEach(k=>delete $('#'+k).dataset.auto);
  $('#del').hidden=!d;
  $('#meta').textContent=d?`Creado ${fmt(d.creado)}`:'La fecha y hora se registran al guardar.';
  $('#gdlg').close();$('#dlg').showModal();
}
$('#nuevo').onclick=()=>abrir(null);
$('#cancel').onclick=()=>$('#dlg').close();
['tienda','coord'].forEach(k=>$('#'+k).addEventListener('input',e=>delete e.target.dataset.auto));
// Autocompletar Tienda y Coordinador con los 5 primeros dígitos del ticket
$('#ticket').addEventListener('input',e=>{
  const p=e.target.value.trim().slice(0,5);if(p.length<5)return;
  const prev=D.filter(d=>d.id!==editId&&d.ticket.slice(0,5)===p).sort((a,b)=>b.creado-a.creado)[0];
  if(!prev)return;
  [['tienda',prev.tienda],['coord',prev.coord]].forEach(([k,v])=>{
    const el=$('#'+k);if(!el.value||el.dataset.auto){el.value=v;el.dataset.auto='1'}});
});
$('#frm').addEventListener('submit',e=>{
  e.preventDefault();
  const v={ticket:$('#ticket').value.trim(),tienda:$('#tienda').value.trim(),status:$('#status').value,
    equipo:$('#equipo').value.trim(),coord:$('#coord').value.trim(),falla:$('#falla').value.trim(),obs:$('#obs').value.trim()};
  if(editId){const d=D.find(x=>x.id===editId);Object.assign(d,v,{editado:Date.now()})}
  else D.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),creado:Date.now(),...v});
  save();$('#dlg').close();render();toast('Guardado ✓');
});
$('#del').onclick=()=>{if(confirm('¿Eliminar esta orden? No se puede deshacer.')){D=D.filter(x=>x.id!==editId);save();$('#dlg').close();render()}};

/* ---------- Lista por Tienda / Coordinador ---------- */
function abrirGrupo(tipo,valor){grp={tipo,valor};$('#gt').textContent=(tipo==='tienda'?'Tienda: ':'Coordinador: ')+valor;renderGrupo();$('#gdlg').showModal()}
function renderGrupo(){
  const o=$('#gs').value;
  const r=D.filter(d=>d[grp.tipo]===grp.valor).sort((a,b)=>
    o==='fd'?b.creado-a.creado:o==='fa'?a.creado-b.creado:
    o==='az'?a.ticket.localeCompare(b.ticket,'es',{numeric:true}):b.ticket.localeCompare(a.ticket,'es',{numeric:true}));
  $('#gl').innerHTML=r.map(d=>`<div class="item" data-g="${d.id}"><div><b>${esc(d.ticket)}</b><br><span class="date">${esc(d.equipo)} · ${esc(d.falla)} · ${fmt(d.creado)}</span></div><span class="badge" style="--c:var(--${d.status})">${d.status}</span></div>`).join('');
}
$('#gs').onchange=renderGrupo;
$('#gc').onclick=()=>$('#gdlg').close();
$('#gl').addEventListener('click',e=>{const i=e.target.closest('[data-g]');if(i)abrir(D.find(x=>x.id===i.dataset.g))});

/* ---------- Copiar reportes por estatus ---------- */
function copiarPorStatus(s){
  const r=D.filter(d=>d.status===s).sort((a,b)=>a.creado-b.creado);
  if(!r.length)return toast('No hay reportes '+s.toLowerCase()+'s');
  copy(r.map(d=>[d.ticket,d.tienda,d.equipo,d.coord,d.falla].join(' | ')).join('\n'));
}
$('#cpAb').onclick=()=>copiarPorStatus('Abierto');
$('#cpPe').onclick=()=>copiarPorStatus('Pendiente');

/* ---------- Exportar / Importar ---------- */
$('#exp').onclick=()=>{
  const b=new Blob([JSON.stringify({version:1,exportado:new Date().toISOString(),ordenes:D},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='ordenes-servicio-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());const arr=Array.isArray(j)?j:j.ordenes;
    if(!Array.isArray(arr))throw 0;
    let n=0;
    arr.forEach(o=>{
      if(!o||typeof o.ticket!=='string')return;
      const x={id:String(o.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),creado:+o.creado||Date.now(),
        ticket:o.ticket,tienda:String(o.tienda||''),status:STATUS.includes(o.status)?o.status:'Abierto',
        equipo:String(o.equipo||''),coord:String(o.coord||''),falla:String(o.falla||''),obs:String(o.obs||''),editado:o.editado?+o.editado:undefined};
      const i=D.findIndex(d=>d.id===x.id);i<0?D.push(x):D[i]=x;n++});
    save();render();toast(n+' órdenes importadas ✓');
  }catch{toast('Archivo JSON no válido')}
};

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script>
</body>
</html>
