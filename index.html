<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órdenes de servicio</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#10201e;--mu:#62736f;--ln:#e0e7e5;--ac:#0f766e;--ac2:#0b5d57;--acs:#d9f0ec;--dg:#b42318;
--s-Abierto:#0f766e;--s-Asignado:#2563eb;--s-Pendiente:#b7791f;--s-Cerrado:#64748b;--s-Cancelado:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d1514;--card:#16201f;--tx:#e8f0ee;--mu:#8fa39f;--ln:#26332f;--ac:#2dd4bf;--ac2:#5eead4;--acs:#12332f;--dg:#f87171;
--s-Abierto:#2dd4bf;--s-Asignado:#60a5fa;--s-Pendiente:#fbbf24;--s-Cerrado:#94a3b8;--s-Cancelado:#f87171}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.bulk{display:flex;gap:6px}
.pill{border:1px solid var(--ln);background:var(--card);padding:7px 12px;border-radius:99px;font-size:.82rem;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill:hover{border-color:var(--ac)}
.big{width:100%;background:var(--ac);color:#fff;border-radius:20px;padding:26px 16px;font-size:1.3rem;font-weight:700;display:flex;justify-content:center;align-items:center;gap:12px;box-shadow:0 8px 24px -10px var(--ac);transition:transform .1s}
@media(prefers-color-scheme:dark){.big{color:#042f2a}}
.big:active{transform:scale(.98)}
.big svg{width:28px;height:28px}
.search{margin:14px 0 10px;position:relative}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--ln);background:var(--card)}
.search svg{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:.85rem;font-weight:600;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#042f2a}}
.chip small{opacity:.75;margin-left:4px}
#lista{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--c,var(--ln));border-radius:14px;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tk{font-weight:700;font-size:1.05rem;color:var(--ac);text-decoration:underline;text-underline-offset:3px;text-align:left}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;color:var(--c);border:1px solid var(--c);display:inline-flex;align-items:center;gap:4px}
.sp{flex:1}
.f{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-top:1px solid var(--ln);font-size:.9rem}
.f:first-of-type{border-top:0}
.l{width:92px;flex:none;color:var(--mu);font-size:.8rem;padding-top:1px}
.v{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.lk{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left;color:var(--tx)}
.cp{flex:none;width:30px;height:30px;border-radius:8px;color:var(--mu);display:grid;place-items:center}
.cp:hover{background:var(--acs);color:var(--ac)}
.cp svg{width:16px;height:16px}
.ts{font-size:.75rem;color:var(--mu);margin-top:4px}
.empty{text-align:center;color:var(--mu);padding:36px 12px;border:1px dashed var(--ln);border-radius:14px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
footer p{width:100%;text-align:center;color:var(--mu);font-size:.78rem}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--bg);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;position:sticky;top:0;background:var(--bg);z-index:1}
.dh h2{font-size:1.1rem}
.x{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--ln);font-size:1.1rem}
.db{padding:6px 18px 18px;display:grid;gap:12px}
label{display:grid;gap:5px;font-size:.82rem;font-weight:600;color:var(--mu)}
label input,label select,label textarea{padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-weight:400;font-size:1rem}
textarea{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;background:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){.btn{color:#042f2a}}
.btn.del{flex:none;background:none;color:var(--dg);border:1px solid var(--dg)}
.hint{font-size:.75rem;color:var(--ac);font-weight:500}
.lrow{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;font-size:.88rem}
.lrow .top{margin:0 0 4px}
.toolbar{display:flex;gap:8px;align-items:center}
.toolbar select{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.l{width:78px}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Órdenes de servicio</h1>
  <div class="bulk">
    <button class="pill" data-act="bulk" data-s="Abierto">Copiar abiertos</button>
    <button class="pill" data-act="bulk" data-s="Pendiente">Copiar pendientes</button>
  </div>
</header>

<button class="big" data-act="nuevo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Nueva orden de servicio
</button>

<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="Buscar ticket, tienda, falla, coordinador…" autocomplete="off">
</div>

<nav class="chips" id="chips" aria-label="Filtrar por estatus"></nav>
<section id="lista" aria-live="polite"></section>

<footer>
  <button class="pill" id="exp">⬇ Exportar datos (JSON)</button>
  <button class="pill" id="imp">⬆ Importar datos (JSON)</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <p>Todo se guarda solo en este dispositivo. Exporta un respaldo con frecuencia.</p>
</footer>
</main>

<dialog id="fm">
  <form method="dialog" id="form" autocomplete="off">
    <div class="dh"><h2 id="ft">Nueva orden</h2><button type="button" class="x" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="db">
      <input type="hidden" id="id">
      <label>Ticket<input id="ticket" required inputmode="text" placeholder="Los primeros 5 dígitos identifican la tienda"></label>
      <div class="g2">
        <label>Tienda<input id="tienda" placeholder="Nombre de la tienda"></label>
        <label>Coordinador<input id="coordinador" placeholder="Nombre"></label>
      </div>
      <span class="hint" id="auto" hidden></span>
      <div class="g2">
        <label>Estatus<select id="estatus"></select></label>
        <label>Equipo<select id="equipo"></select></label>
      </div>
      <label>Falla<textarea id="falla"></textarea></label>
      <label>Observaciones<textarea id="observaciones"></textarea></label>
      <div class="ts" id="fts"></div>
      <div class="acts">
        <button type="button" class="btn del" id="del" hidden>Eliminar</button>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="lm">
  <div class="dh"><h2 id="lt"></h2><button class="x" data-act="close" aria-label="Cerrar">✕</button></div>
  <div class="db">
    <div class="toolbar">
      <select id="lsort" aria-label="Ordenar">
        <option value="fd">Fecha y hora ↓ (recientes)</option>
        <option value="fa">Fecha y hora ↑ (antiguos)</option>
        <option value="az">Alfabético A → Z</option>
        <option value="za">Alfabético Z → A</option>
      </select>
    </div>
    <div id="ll" style="display:grid;gap:8px"></div>
  </div>
</dialog>
<div id="toast" role="status"></div>

<script>
(()=>{
const KEY='ordenes_servicio_v1';
const ESTATUS=['Abierto','Cerrado','Asignado','Pendiente','Cancelado'];
const EQUIPOS=['Merrychef','Turbochef','Bunn','NuVu','Molino','Licuadora','Báscula','Otros'];
const FILTROS=[['todos','Todos'],['Abierto','Abiertos'],['Asignado','Asignados'],['Cerrado','Cerrados'],['Pendiente','Pendientes']];
const LABELS={ticket:'Ticket',tienda:'Tienda',estatus:'Estatus',equipo:'Equipo',coordinador:'Coordinador',falla:'Falla',observaciones:'Observaciones'};
const $=s=>document.querySelector(s);
const ICO_CP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
let orders=load(),filtro='todos',lctx=null,autoT=false,autoC=false;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){toast('No se pudo guardar: almacenamiento lleno')}}
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fecha=t=>new Date(t).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(txt,msg){
  try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  toast(msg||'Copiado')
}
const line=o=>[o.ticket,o.tienda,o.equipo,o.coordinador,o.falla].join(' | ');

// ---------- selects ----------
$('#estatus').innerHTML=ESTATUS.map(s=>`<option>${s}</option>`).join('');
$('#equipo').innerHTML=EQUIPOS.map(s=>`<option>${s}</option>`).join('');

// ---------- lista principal ----------
function row(o,f,link){
  const v=o[f];
  const val=v?(link?`<button class="lk" data-act="${link}" data-id="${o.id}">${h(v)}</button>`:h(v)):'<span style="color:var(--mu)">—</span>';
  return `<div class="f"><span class="l">${LABELS[f]}</span><span class="v">${val}</span><button class="cp" data-act="copy" data-id="${o.id}" data-f="${f}" aria-label="Copiar ${LABELS[f]}">${ICO_CP}</button></div>`;
}
function card(o){
  return `<article class="card" style="--c:var(--s-${o.estatus})">
  <div class="top"><button class="tk" data-act="edit" data-id="${o.id}">${h(o.ticket)}</button>
  <span class="badge">${h(o.estatus)}</span><span class="sp"></span>
  <button class="cp" data-act="copyall" data-id="${o.id}" aria-label="Copiar toda la orden" title="Copiar todo">${ICO_CP}</button></div>
  ${row(o,'tienda','tienda')}${row(o,'equipo')}${row(o,'coordinador','coord')}${row(o,'falla')}${row(o,'estatus')}${row(o,'observaciones')}
  <div class="ts">${fecha(o.creado)}</div></article>`;
}
function hay(o){return norm([o.ticket,o.tienda,o.estatus,o.equipo,o.coordinador,o.falla,o.observaciones,fecha(o.creado)].join(' '))}
function render(){
  const q=norm($('#q').value.trim());
  const vis=o=>filtro==='todos'?!['Cerrado','Cancelado'].includes(o.estatus):o.estatus===filtro;
  $('#chips').innerHTML=FILTROS.map(([k,n])=>{const c=orders.filter(o=>k==='todos'?!['Cerrado','Cancelado'].includes(o.estatus):o.estatus===k).length;
    return `<button class="chip" data-act="filtro" data-k="${k}" aria-pressed="${k===filtro}">${n}<small>${c}</small></button>`}).join('');
  let list=orders.slice().sort((a,b)=>b.creado-a.creado);
  list=q?list.filter(o=>hay(o).includes(q)):list.filter(vis);
  $('#lista').innerHTML=list.length?list.map(card).join(''):
    `<div class="empty">${q?'Sin resultados para esa búsqueda.':orders.length?'No hay órdenes en este filtro.':'Aún no hay órdenes. Toca “Nueva orden de servicio” para empezar.'}</div>`;
}

// ---------- formulario ----------
function openForm(id){
  const o=orders.find(x=>x.id===id)||null,f=$('#form');
  f.reset();autoT=autoC=false;$('#auto').hidden=true;
  $('#ft').textContent=o?'Editar orden':'Nueva orden';
  $('#id').value=o?o.id:'';
  for(const k of Object.keys(LABELS))$('#'+k).value=o?o[k]:(k==='estatus'?'Abierto':k==='equipo'?'Merrychef':'');
  $('#del').hidden=!o;
  $('#fts').textContent=o?'Creada: '+fecha(o.creado)+(o.editado?' · Editada: '+fecha(o.editado):''):'La fecha y hora se registran automáticamente al guardar.';
  $('#fm').showModal();
  if(!o)setTimeout(()=>$('#ticket').focus(),50);
}
$('#ticket').addEventListener('input',()=>{
  const p=$('#ticket').value.trim().slice(0,5),id=$('#id').value;
  if(p.length<5)return;
  const m=orders.filter(o=>o.id!==id&&o.ticket.trim().slice(0,5)===p).sort((a,b)=>b.creado-a.creado)[0];
  if(!m)return;
  const t=$('#tienda'),c=$('#coordinador');
  if(!t.value||autoT){t.value=m.tienda;autoT=true}
  if(!c.value||autoC){c.value=m.coordinador;autoC=true}
  $('#auto').textContent='Tienda y coordinador completados con la última orden de '+p;$('#auto').hidden=false;
});
$('#tienda').addEventListener('input',()=>autoT=false);
$('#coordinador').addEventListener('input',()=>autoC=false);
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const d={};for(const k of Object.keys(LABELS))d[k]=$('#'+k).value.trim();
  if(!d.ticket){toast('Escribe el número de ticket');return}
  const id=$('#id').value;
  if(id){const o=orders.find(x=>x.id===id);Object.assign(o,d,{editado:Date.now()})}
  else orders.push({id:uid(),creado:Date.now(),...d});
  save();$('#fm').close();render();refreshList();toast('Guardado');
});
$('#del').addEventListener('click',()=>{
  if(!confirm('¿Eliminar esta orden? No se puede deshacer.'))return;
  orders=orders.filter(o=>o.id!==$('#id').value);save();$('#fm').close();render();refreshList();toast('Eliminada');
});

// ---------- lista por tienda / coordinador ----------
function openList(type,id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  lctx={type,value:o[type]};$('#lsort').value='fd';refreshList();$('#lm').showModal();
}
function refreshList(){
  if(!lctx||!$('#lm').open)return;
  const {type,value}=lctx,s=$('#lsort').value;
  const l=orders.filter(o=>o[type]===value);
  l.sort((a,b)=>s==='fd'?b.creado-a.creado:s==='fa'?a.creado-b.creado:s==='az'?a.ticket.localeCompare(b.ticket,'es',{numeric:true}):b.ticket.localeCompare(a.ticket,'es',{numeric:true}));
  $('#lt').textContent=(type==='tienda'?'Tienda: ':'Coordinador: ')+value+' ('+l.length+')';
  $('#ll').innerHTML=l.map(o=>`<div class="lrow" style="--c:var(--s-${o.estatus})"><div class="top"><button class="tk" data-act="edit" data-id="${o.id}">${h(o.ticket)}</button><span class="badge">${h(o.estatus)}</span></div>
  <div>${h(o.equipo)} · ${h(type==='tienda'?o.coordinador:o.tienda)}</div><div>${h(o.falla)}</div><div class="ts">${fecha(o.creado)}</div></div>`).join('')||'<div class="empty">Sin órdenes.</div>';
}
$('#lsort').addEventListener('change',refreshList);

// ---------- acciones ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,o=orders.find(x=>x.id===id);
  if(a==='nuevo')openForm();
  else if(a==='edit'){$('#lm').close();openForm(id)}
  else if(a==='tienda')openList('tienda',id);
  else if(a==='coord')openList('coordinador',id);
  else if(a==='filtro'){filtro=b.dataset.k;render()}
  else if(a==='close')b.closest('dialog').close();
  else if(a==='copy'&&o)copy(o[b.dataset.f],LABELS[b.dataset.f]+' copiado');
  else if(a==='copyall'&&o)copy(Object.keys(LABELS).map(k=>LABELS[k]+': '+o[k]).join('\n'),'Orden copiada');
  else if(a==='bulk'){
    const l=orders.filter(x=>x.estatus===b.dataset.s).sort((x,y)=>x.creado-y.creado);
    if(!l.length){toast('No hay órdenes '+(b.dataset.s==='Abierto'?'abiertas':'pendientes'));return}
    copy(l.map(line).join('\n'),l.length+' copiadas');
  }
});
$('#q').addEventListener('input',render);
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

// ---------- exportar / importar ----------
$('#exp').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'ordenes-servicio',version:1,exportado:new Date().toISOString(),ordenes:orders},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='ordenes-servicio-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Respaldo exportado');
});
$('#imp').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:d.ordenes;
    if(!Array.isArray(arr))throw 0;
    const s=v=>String(v??'').slice(0,5000);
    const clean=arr.filter(o=>o&&o.ticket).map(o=>({id:s(o.id)||uid(),creado:Number(o.creado)||Date.now(),editado:o.editado?Number(o.editado):undefined,
      ticket:s(o.ticket),tienda:s(o.tienda),estatus:ESTATUS.includes(o.estatus)?o.estatus:'Abierto',equipo:s(o.equipo),coordinador:s(o.coordinador),falla:s(o.falla),observaciones:s(o.observaciones)}));
    if(!confirm('Se combinarán '+clean.length+' órdenes con las actuales (si el ID coincide, se actualiza). ¿Continuar?'))return;
    const m=new Map(orders.map(o=>[o.id,o]));clean.forEach(o=>m.set(o.id,o));
    orders=[...m.values()];save();render();toast('Datos importados');
  }catch(_){toast('Archivo JSON no válido')}
});

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
})();
</script>
</body>
</html>
