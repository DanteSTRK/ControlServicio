<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órdenes de servicio</title>
<meta name="theme-color" content="#4338ca">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f6f9;--card:#fff;--tx:#16161d;--mu:#6b6b7b;--ln:#e6e6ee;--ac:#4338ca;--ac2:#6d5dfc;--on:#fff;
--Abierto:#16a34a;--Asignado:#2563eb;--Pendiente:#d97706;--Cerrado:#71717a;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e13;--card:#17171f;--tx:#f0f0f6;--mu:#9a9aab;--ln:#2a2a36;--ac:#8b7dff;--ac2:#6d5dfc;--on:#0e0e13}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.15rem;font-weight:700;margin:4px 0 14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.big{width:100%;padding:22px;border-radius:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:1.25rem;font-weight:700;box-shadow:0 8px 24px -8px var(--ac);display:flex;align-items:center;justify-content:center;gap:10px}
.big:active{transform:scale(.98)}
.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ghost{padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--card);font-weight:600;font-size:.9rem}
.ghost:active{background:var(--ln)}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
#q{margin:4px 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);white-space:nowrap;font-size:.9rem;color:var(--mu)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.hint{font-size:.8rem;color:var(--mu);margin:2px 2px 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:10px;border-left:4px solid var(--c,var(--ln))}
.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tk{font-weight:700;font-size:1.05rem;color:var(--ac);text-decoration:underline;text-underline-offset:3px}
.badge{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.dt{margin-left:auto;font-size:.75rem;color:var(--mu)}
.row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:1px solid var(--ln);font-size:.92rem}
.row:first-of-type{border-top:0}
.row b{flex:0 0 96px;font-weight:500;color:var(--mu);font-size:.82rem;padding-top:2px}
.row span{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.lk{color:var(--ac);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.cp{flex:0 0 auto;width:30px;height:30px;border-radius:8px;color:var(--mu);font-size:.95rem}
.cp:active,.cp:hover{background:var(--ln);color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:36px 12px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--ln)}
.foot p{font-size:.8rem;color:var(--mu);margin-bottom:10px}
.foot .top{margin:0}
dialog{border:0;border-radius:20px;padding:0;background:var(--bg);color:var(--tx);width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;gap:10px}
.dh h2{font-size:1.05rem;overflow-wrap:anywhere}
.x{width:36px;height:36px;border-radius:50%;background:var(--ln);font-size:1.1rem}
.db{padding:10px 18px 18px}
label{display:block;font-size:.82rem;color:var(--mu);margin:12px 0 4px}
textarea{min-height:76px;resize:vertical}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;padding:14px;border-radius:12px;font-weight:700}
.pri{background:var(--ac);color:var(--on)}
.del{background:color-mix(in srgb,#dc2626 14%,transparent);color:#dc2626;flex:0 0 auto!important}
.meta{font-size:.75rem;color:var(--mu);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Órdenes de servicio</h1>
<button class="big" id="new"><span style="font-size:1.6rem">＋</span> Nueva orden de servicio</button>
<div class="top">
<button class="ghost" id="cpA">📋 Copiar abiertos</button>
<button class="ghost" id="cpP">📋 Copiar pendientes</button>
</div>
<input id="q" type="search" placeholder="Buscar ticket, tienda, equipo, falla…" autocomplete="off">
<div class="chips" id="chips"></div>
<div class="hint" id="hint"></div>
<div id="list"></div>

<div class="foot">
<p>Los datos se guardan solo en este dispositivo. Exporta un respaldo con regularidad.</p>
<div class="top">
<button class="ghost" id="exp">⬇ Exportar JSON</button>
<button class="ghost" id="imp">⬆ Importar JSON</button>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
</div>
</main>

<dialog id="fm"><form id="f" autocomplete="off">
<div class="dh"><h2 id="ft">Nueva orden</h2><button type="button" class="x" data-close>✕</button></div>
<div class="db">
<label for="ticket">Ticket</label><input id="ticket" required inputmode="numeric">
<label for="tienda">Tienda</label><input id="tienda">
<label for="status">Status</label><select id="status"></select>
<label for="equipo">Equipo</label><select id="equipo"></select>
<label for="coord">Coordinador</label><input id="coord">
<label for="falla">Falla</label><input id="falla">
<label for="obs">Observaciones</label><textarea id="obs"></textarea>
<div class="meta" id="meta"></div>
<div class="acts"><button type="button" class="del" id="del" hidden>Eliminar</button><button class="pri">Guardar</button></div>
</div></form></dialog>

<dialog id="dl">
<div class="dh"><h2 id="dt2"></h2><button type="button" class="x" data-close>✕</button></div>
<div class="db"><select id="sort" aria-label="Ordenar">
<option value="fd">Fecha y hora ↓ (recientes)</option><option value="fa">Fecha y hora ↑ (antiguos)</option>
<option value="az">Alfabético A → Z</option><option value="za">Alfabético Z → A</option></select>
<div id="dlist" style="margin-top:12px"></div></div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),KEY='ordenes_servicio_v1';
const EQ=['Merrychef','Bunn','Nuvu','Molino','Licuadora','Turbochef','Báscula','Otros'];
const ST=['Abierto','Asignado','Pendiente','Cerrado'];
const FL=[['todos','Todos'],['Abierto','Abiertos'],['Asignado','Asignados'],['Cerrado','Cerrados'],['Pendiente','Pendientes']];
const LBL={ticket:'Ticket',tienda:'Tienda',status:'Status',equipo:'Equipo',coord:'Coordinador',falla:'Falla',obs:'Observaciones'};
let data=[],filt='todos',drill=null,autoFill=true;
try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('No se pudo guardar')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}):'';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),1800)}
async function copy(txt){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('Copiado')}
const id2=id=>data.find(o=>o.id===id);

$('#status').innerHTML=ST.map(s=>`<option>${s}</option>`).join('');
$('#equipo').innerHTML=EQ.map(s=>`<option>${s}</option>`).join('');
$('#chips').innerHTML=FL.map(([k,l])=>`<button class="chip" data-f="${k}">${l}</button>`).join('');

function card(o){
 const c=`var(--${o.status})`,rows=[['tienda',o.tienda,'tienda'],['equipo',o.equipo],['coord',o.coord,'coord'],['falla',o.falla],['obs',o.obs]];
 return `<div class="card" style="--c:${c}" data-id="${esc(o.id)}">
 <div class="hd"><span class="lk tk" data-act="edit">${esc(o.ticket)}</span>
 <button class="cp" data-copy="ticket" aria-label="Copiar ticket">⧉</button>
 <span class="badge" style="--c:${c}">${esc(o.status)}</span>
 <button class="cp" data-copy="status" aria-label="Copiar status">⧉</button>
 <span class="dt">${fmt(o.createdAt)}</span></div>
 ${rows.map(([k,v,a])=>`<div class="row"><b>${LBL[k]}</b><span>${v?(a?`<span class="lk" data-act="${a}">${esc(v)}</span>`:esc(v)):'<span style="color:var(--mu)">—</span>'}</span><button class="cp" data-copy="${k}" aria-label="Copiar ${LBL[k]}">⧉</button></div>`).join('')}</div>`}

function render(){
 const q=$('#q').value.trim().toLowerCase();
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===filt&&!q));
 let l=data.filter(o=>q?Object.values(o).some(v=>String(v).toLowerCase().includes(q)):(filt==='todos'?o.status!=='Cerrado':o.status===filt));
 l.sort((a,b)=>b.createdAt-a.createdAt);
 $('#hint').textContent=q?`${l.length} resultado(s) en todas las órdenes`:`${l.length} orden(es)`+(filt==='todos'?' · sin cerradas':'');
 $('#list').innerHTML=l.length?l.map(card).join(''):`<div class="empty">${data.length?'Sin resultados.':'Aún no hay órdenes. Toca “Nueva orden de servicio” para crear la primera.'}</div>`;
 if(drill)renderDrill();
}

function openForm(id){
 const o=id?id2(id):null,f=$('#f');f.reset();autoFill=!o;
 $('#ft').textContent=o?'Editar orden':'Nueva orden';
 $('#del').hidden=!o;f.dataset.id=o?o.id:'';
 if(o){ticket.value=o.ticket;tienda.value=o.tienda;status.value=o.status;equipo.value=o.equipo;coord.value=o.coord;falla.value=o.falla;obs.value=o.obs;
  $('#meta').textContent='Creada: '+fmt(o.createdAt)+(o.updatedAt?' · Editada: '+fmt(o.updatedAt):'')}
 else{status.value='Abierto';$('#meta').textContent='La fecha y hora se registran al guardar.'}
 if($('#dl').open)$('#dl').close();
 $('#fm').showModal();
}
// Autorrelleno por los 5 primeros dígitos del ticket
$('#ticket').addEventListener('input',()=>{
 const t=ticket.value.trim();if(t.length<5||!autoFill)return;
 const k=t.slice(0,5),cur=$('#f').dataset.id;
 const m=data.filter(o=>o.id!==cur&&o.ticket.trim().slice(0,5)===k).sort((a,b)=>b.createdAt-a.createdAt)[0];
 if(m){tienda.value=m.tienda;coord.value=m.coord}
});
['tienda','coord'].forEach(i=>$('#'+i).addEventListener('input',()=>autoFill=false));

$('#f').addEventListener('submit',e=>{
 e.preventDefault();const cur=e.target.dataset.id,now=Date.now();
 const v={ticket:ticket.value.trim(),tienda:tienda.value.trim(),status:status.value,equipo:equipo.value,coord:coord.value.trim(),falla:falla.value.trim(),obs:obs.value.trim()};
 if(!v.ticket)return;
 if(cur)Object.assign(id2(cur),v,{updatedAt:now});
 else data.push({id:now.toString(36)+Math.random().toString(36).slice(2,6),createdAt:now,updatedAt:null,...v});
 save();$('#fm').close();render();toast('Guardado');
});
$('#del').onclick=()=>{const cur=$('#f').dataset.id;if(cur&&confirm('¿Eliminar esta orden?')){data=data.filter(o=>o.id!==cur);save();$('#fm').close();render();toast('Eliminada')}};

function renderDrill(){
 const {k,v}=drill,s=$('#sort').value;
 let l=data.filter(o=>o[k]===v);
 const cmp={fd:(a,b)=>b.createdAt-a.createdAt,fa:(a,b)=>a.createdAt-b.createdAt,az:(a,b)=>a.ticket.localeCompare(b.ticket,'es',{numeric:true}),za:(a,b)=>b.ticket.localeCompare(a.ticket,'es',{numeric:true})}[s];
 l.sort(cmp);$('#dt2').textContent=`${k==='tienda'?'Tienda':'Coordinador'}: ${v} (${l.length})`;
 $('#dlist').innerHTML=l.map(card).join('');
}
$('#sort').onchange=renderDrill;

document.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('[data-close]')){t.closest('dialog').close();if(t.closest('#dl'))drill=null;return}
 const f=t.closest('.chip');if(f){filt=f.dataset.f;$('#q').value='';render();return}
 const c=t.closest('.card');if(!c)return;
 const o=id2(c.dataset.id);if(!o)return;
 const cp=t.closest('[data-copy]');if(cp){copy(o[cp.dataset.copy]||'');return}
 const a=t.closest('[data-act]');if(!a)return;
 if(a.dataset.act==='edit')openForm(o.id);
 else if(o[a.dataset.act]){drill={k:a.dataset.act,v:o[a.dataset.act]};$('#sort').value='fd';renderDrill();$('#dl').showModal()}
});
$('#dl').addEventListener('close',()=>drill=null);

const batch=st=>{
 const l=data.filter(o=>o.status===st).sort((a,b)=>b.createdAt-a.createdAt);
 if(!l.length)return toast('No hay órdenes '+(st==='Abierto'?'abiertas':'pendientes'));
 copy(l.map(o=>[o.ticket,o.tienda,o.equipo,o.coord,o.falla].join(' | ')).join('\n'));
};
$('#cpA').onclick=()=>batch('Abierto');$('#cpP').onclick=()=>batch('Pendiente');
$('#new').onclick=()=>openForm();
$('#q').addEventListener('input',render);

$('#exp').onclick=()=>{
 const b=new Blob([JSON.stringify({app:'ordenes-servicio',version:1,exportado:new Date().toISOString(),ordenes:data},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ordenes-servicio-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Respaldo exportado');
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.ordenes;
  if(!Array.isArray(arr))throw 0;
  const ok=arr.filter(o=>o&&o.ticket&&o.id).map(o=>({id:String(o.id),createdAt:+o.createdAt||Date.now(),updatedAt:o.updatedAt||null,ticket:String(o.ticket),tienda:String(o.tienda||''),status:ST.includes(o.status)?o.status:'Abierto',equipo:String(o.equipo||'Otros'),coord:String(o.coord||''),falla:String(o.falla||''),obs:String(o.obs||'')}));
  if(!ok.length)throw 0;
  if(!confirm(`Se importarán ${ok.length} orden(es). Las que ya existan se actualizarán y el resto se conserva. ¿Continuar?`))return;
  const m=new Map(data.map(o=>[o.id,o]));ok.forEach(o=>m.set(o.id,o));data=[...m.values()];save();render();toast('Datos importados');
 }catch(_){alert('El archivo no es un respaldo válido.')}
};

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
</script>
</body>
</html>
